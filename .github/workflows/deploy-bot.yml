name: Deploy Bot

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'scraper/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: refdmlang
  REGION: us-central1
  SERVICE: dm-ref-bot
  IMAGE: us-central1-docker.pkg.dev/refdmlang/dm-ref-bot/dm-ref-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/68509514696/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@refdmlang.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build \
            -f bot/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
